name: Build DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm nút build bằng tay

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      # Lưu ý: Sửa 'Fivem-External.sln' thành đúng tên file .sln của mày nếu khác
      # Ép buộc build bằng cấu hình Release và nền tảng x86 (32-bit)
      run: msbuild Fivem-External.sln /p:Configuration=Release /p:Platform=x86

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        # Tên file nén chứa DLL mày tải về
        name: Cheat-DLL-x86
        # Đường dẫn tới file .dll sau khi build xong (mày phải xem lại cấu trúc thư mục của mày)
        path: |
          **/x86/Release/*.dll
          **/Release/*.dll

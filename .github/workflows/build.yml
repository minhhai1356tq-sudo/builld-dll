name: Build DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      # Quét toàn bộ tìm file .vcxproj của Fivem hoặc viperx (bỏ qua sln)
      run: |
        $proj = Get-ChildItem -Path . -Filter *.vcxproj -Recurse | Where-Object { $_.Name -match "Fivem|viperx|internal" } | Select-Object -First 1
        if ($proj) {
          Write-Host "Tìm thấy project: $($proj.FullName)"
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x86
        } else {
          Write-Error "Không tìm thấy file .vcxproj nào của source hack!"
        }

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cheat-DLL-x86
        path: |
          **/x86/Release/*.dll
          **/Release/*.dll
          **/*.dll

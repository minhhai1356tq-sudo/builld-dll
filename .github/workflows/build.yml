name: Build DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      # Tự động tìm file .sln ở bất kỳ đâu trong repo
      run: |
        $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
        if ($sln) {
          Write-Host "Tìm thấy file: $($sln.FullName)"
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x86
        } else {
          Write-Error "Không tìm thấy file .sln nào trong toàn bộ repository!"
        }

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cheat-DLL-x86
        path: |
          **/x86/Release/*.dll
          **/Release/*.dll
          **/*.dll
